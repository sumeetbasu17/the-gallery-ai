[project]
name = "the-gallery"
version = "0.1.0"
description = "An AI broadcast crew that turns synthetic football events into explainable, personalised match intelligence."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "agent-framework-core>=1.23",
  "mcp>=2.3",
  "tenacity>=8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
azure = [
  "agent-framework-foundry>=1.15",
  "agent-framework-openai>=1.17",
  "openai>=1.60",
  "azure-identity>=1.17",
  "azure-eventhub>=5.11",
  "azure-cosmos>=4.7",
  "azure-monitor-opentelemetry>=1.6",
  "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
where = ["packages/schema", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/schema", "services"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
